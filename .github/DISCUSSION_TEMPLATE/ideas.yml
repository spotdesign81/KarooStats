labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should KarooStats do, and in which riding situation would it help?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Statistics
        - Maintenance
        - In-ride data fields
        - Bike detection
        - Languages
        - Other
