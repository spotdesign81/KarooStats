name: Feature request
description: Suggest a concrete improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like KarooStats to do?
      description: Describe the problem or the ride situation first, then the idea.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details (optional)
      description: Screens, data fields, maintenance intervals, links to brand documentation…
